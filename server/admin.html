<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coltek conversations</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#17202a;background:#f4f6f8}header{padding:20px 28px;background:#102b46;color:white}h1{font-size:21px;margin:0}main{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}section{background:white;border:1px solid #dce2e8;border-radius:10px;overflow:hidden}.toolbar{padding:12px;border-bottom:1px solid #e5e9ed;display:flex;gap:8px}input{min-width:0;flex:1;padding:9px;border:1px solid #cbd3dc;border-radius:6px}button{cursor:pointer;padding:8px 10px;border:1px solid #cbd3dc;background:white;border-radius:6px;color:inherit}#threads{max-height:calc(100vh - 160px);overflow:auto}.thread{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf0f2;border-radius:0;padding:13px}.thread:hover,.thread.selected{background:#eef5fb}.muted{color:#697785;font-size:12px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}#messages{padding:18px;min-height:300px;max-height:calc(100vh - 100px);overflow:auto}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 13px;margin:10px 0;border-radius:10px;max-width:85%;background:#f0f2f4}.msg.user{margin-left:auto;background:#e7f2ff}.meta{font-size:11px;color:#637180;margin-bottom:4px}.empty{padding:24px;color:#697785}@media(max-width:700px){main{grid-template-columns:1fr}#threads{max-height:34vh}#messages{max-height:none}}
</style></head><body><header><h1>Customer conversations</h1></header><main>
<section><div class="toolbar"><input id="filter" placeholder="Filter conversations"><button id="refresh">Refresh</button></div><div id="threads"><p class="empty">Loading…</p></div></section>
<section><div id="messages"><p class="empty">Select a conversation to read its messages.</p></div></section></main>
<script>
const box=document.querySelector('#threads'),out=document.querySelector('#messages');let rows=[];const date=x=>x?new Date(x).toLocaleString():'';
async function load(){try{const r=await fetch('/admin/api/conversations',{cache:'no-store'});if(!r.ok)throw Error();rows=(await r.json()).conversations;render()}catch{box.textContent='Could not load conversations.'}}
function render(){const q=document.querySelector('#filter').value.toLowerCase();box.replaceChildren();for(const x of rows.filter(x=>(x.id+' '+(x.page||'')+' '+(x.department||'')+' '+(x.last_message||'')).toLowerCase().includes(q))){const b=document.createElement('button');b.className='thread';const title=document.createElement('div');title.textContent=x.id+' · '+date(x.updated_at);const meta=document.createElement('div');meta.className='muted';meta.textContent=(x.department||'Unclassified')+' · '+(x.page||'No page recorded');const preview=document.createElement('div');preview.className='preview';preview.textContent=x.last_message||'No messages';b.append(title,meta,preview);b.onclick=()=>openThread(x.id,b);box.append(b)}if(!box.childNodes.length)box.textContent='No conversations found.'}
async function openThread(id,button){document.querySelectorAll('.thread').forEach(x=>x.classList.toggle('selected',x===button));out.textContent='Loading messages…';try{const r=await fetch('/admin/api/conversations/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();out.replaceChildren();for(const m of data.messages){const b=document.createElement('article');b.className='msg '+(m.role==='user'?'user':'assistant');const meta=document.createElement('div');meta.className='meta';meta.textContent=(m.role==='user'?'Customer':m.agent||'Agent')+' · '+date(m.created_at)+(m.blocked?' · blocked':'');const body=document.createElement('div');body.textContent=m.content;b.append(meta,body);out.append(b)}if(!data.messages.length)out.textContent='No messages in this conversation.';out.scrollTop=out.scrollHeight}catch{out.textContent='Could not load this conversation.'}}
document.querySelector('#refresh').onclick=load;document.querySelector('#filter').oninput=render;load();
</script></body></html>
